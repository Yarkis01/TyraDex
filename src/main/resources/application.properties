spring.application.name=Tyradex
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.org.neo4j.driver=DEBUG

app.bank.img.url=https://raw.githubusercontent.com/TyradexTeam/Sprites/refs/heads/main/